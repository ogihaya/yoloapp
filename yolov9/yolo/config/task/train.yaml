task: train

defaults:
  - validation: ../validation

epoch: 1 # 少ないデータのため長めに学習

data:
  batch_size: 24 # 1280x1280の大きな画像サイズ用に削減
  image_size: ${image_size}
  cpu_num: ${cpu_num}
  shuffle: True
  pin_memory: True
  data_augment:
    # Mosaic: 1  # 小物体検出には不利なので無効化
    # MixUp: 0.5  # 小物体検出には不利なので無効化
    HorizontalFlip: 0.5
    RandomBrightness:
      prob: 0.5
      factor_range: [0.9, 1.1] # 範囲を狭めて安定性向上
    RandomContrast:
      prob: 0.5
      factor_range: [0.9, 1.1] # 範囲を狭めて安定性向上

optimizer:
  type: AdamW
  args:
    # lr: 0.0005  # 事前学習重み使用時は低めの学習率
    lr: 0.0001 # 事前学習重み使用時は低めの学習率
    weight_decay: 0.01

loss:
  objective:
    BCELoss: 1.5
    BoxLoss: 2.0
    DFLoss: 1.5
  aux: 0.25
  matcher:
    iou: CIoU
    topk: 10
    factor:
      iou: 3.0
      cls: 2.0

scheduler:
  type: CosineAnnealingLR
  warmup:
    epochs: 1 # 短縮（100エポック中5%）
  args:
    T_max: 1 # エポック数と一致
    eta_min: 0.00001

ema:
  enable: true
  decay: 0.9999
