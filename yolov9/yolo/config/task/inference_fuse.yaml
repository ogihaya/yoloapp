task: inference

# ヒューズ検出に特化した推論設定
nms:
  min_confidence: 0.1 # 信頼度閾値（0.1 = 10%以上）
  min_iou: 0.5 # IoU閾値（0.5 = 50%以上重複で除去）
  max_detections: 100 # 最大検出数

# 小物体検出に特化した設定
small_object:
  min_size: 10 # 最小検出サイズ（ピクセル）
  max_size: 1000 # 最大検出サイズ（ピクセル）

# クラス別の信頼度閾値
class_thresholds:
  "キープリレー大": 0.15
  "キープリレー小": 0.15
  "コイル(丸型)": 0.1
  "コイル(四角)": 0.1
  "包装ヒューズ": 0.05 # ヒューズは低い閾値で検出
